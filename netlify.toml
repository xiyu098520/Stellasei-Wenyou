[build]
  command = "npm run build"
  publish = "out"
  functions = "netlify/functions"

# 页面已经是纯静态导出，别再让 Netlify 的 Next 运行时接管（否则会按 .next 构建并报 next export 不支持）
[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[functions]
  node_bundler = "esbuild"

# 前端照旧 fetch('/api/xxx')，这里原样转给对应的函数，页面代码不用改
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
